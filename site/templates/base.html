<!doctype html>
<html lang="{{ lang_attr }}" data-copied="{{ copied }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ canonical }}">
{% for h in hreflang %}<link rel="alternate" hreflang="{{ h.code }}" href="{{ h.href }}">
{% endfor %}{% if hreflang %}<link rel="alternate" hreflang="x-default" href="{{ x_default }}">
{% endif %}<meta property="og:type" content="article">
<meta property="og:site_name" content="mutespoilers">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:image" content="{{ og_image }}">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/title.css">
<link rel="stylesheet" href="/ms.css">
{% if jsonld %}<script type="application/ld+json">{{ jsonld | safe }}</script>
{% endif %}</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="{{ home_href }}"><span class="bar" aria-hidden="true"></span>mutespoilers</a>
    <nav class="nav" aria-label="{{ nav_label }}">{% for m in media_nav %}<a href="{{ m.href }}">{{ m.label }}</a>{% endfor %}</nav>
  </div>
</header>
<main{% if main_class %} class="{{ main_class }}"{% endif %}>
{% block main %}{% endblock %}
</main>
<footer class="foot">
  <div class="wrap">
    <nav class="ms-langs" aria-label="Language">{% for l in footer_langs %}<a href="{{ l.href }}" hreflang="{{ l.code }}" lang="{{ l.code }}"{% if l.code == lang_attr %} aria-current="page"{% endif %}>{{ l.label }}</a>{% endfor %}</nav>
  </div>
</footer>
<script src="/title.js" defer></script>
<script src="/ms.js" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
