name: indexnow
# Сообщает Bing/Yandex и др. (IndexNow) о страницах mutespoilers.com (с 26.11.2026; старый github.io больше не пингуем).
# Само после каждой успешной выкладки ms-build; вручную — в любой момент.
on:
  workflow_run:
    workflows: [ms-build]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: indexnow, cancel-in-progress: false }
jobs:
  ping:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      K: 658113910c13cdd1724ac74e4449ac14
      HOST: mutespoilers.com
    steps:
      - name: Collect URLs from live sitemaps
        run: |
          sleep 20
          for sm in $(curl -fsS "https://$HOST/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed 's/<\/*loc>//g'); do
            curl -fsS "$sm" | grep -o '<loc>[^<]*</loc>' | sed 's/<\/*loc>//g'
          done | sort -u > urls.txt
          echo "URL: $(wc -l < urls.txt)"
      - name: Send to IndexNow
        run: |
          [ -s urls.txt ] || { echo "нечего отправлять"; exit 0; }
          jq -Rn --arg k "$K" --arg h "$HOST" --arg kl "https://$HOST/$K.txt" \
            '{host:$h,key:$k,keyLocation:$kl,urlList:[inputs|select(length>0)]}' < urls.txt > body.json
          curl -sS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' \
            --data @body.json -o /dev/null -w "IndexNow: %{http_code}\n"
