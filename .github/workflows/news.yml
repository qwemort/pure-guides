name: news
# Раз в неделю: новости игр/сериалов/аниме из открытых RSS → news/latest.md (читает Claude в начале сессии).
# Живёт здесь, а не в pure-extensions: репозиторий публичный, минуты Actions не ограничены (07.11→21.11.2026, лимит приватного кончился).
on:
  schedule:
    - cron: '23 6 * * 1'   # понедельник 06:23 UTC
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: news
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with: { repository: qwemort/pure-spoiler-shield, path: ext/shield }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: python3 tools/news-digest.py ext/shield/src/lib/words.js
      - name: commit
        run: |
          rm -rf ext
          git config user.name "news bot"
          git config user.email "actions@users.noreply.github.com"
          git add news
          git diff --cached --quiet && exit 0
          git commit -m "news: $(date -u +%F)"
          git pull --rebase --autostash -q origin main
          git push
