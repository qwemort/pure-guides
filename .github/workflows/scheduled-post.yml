name: scheduled-post
# Публикует в Threads пост из queue/<сегодня UTC>.json (текст + картинка). Нет файла или уже есть posted-<дата>.txt = ничего не делает.
# Два запуска в утро: GitHub опаздывает на часы, второй страхует; дубль исключён файлом posted-<дата>.txt.
on:
  schedule:
    - cron: '20 4 * * *'
    - cron: '50 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: scheduled-post, cancel-in-progress: false }
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Publish today's post
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: |
          TODAY=$(date -u +%F)
          mkdir -p out
          if [ ! -f "queue/$TODAY.json" ]; then echo "На $TODAY поста в очереди нет"; exit 0; fi
          if [ -f "queue/posted-$TODAY.txt" ]; then echo "На $TODAY уже опубликовано"; exit 0; fi
          node tools/post-threads.mjs --post "queue/$TODAY.json" --publish
          if grep -q "^опубликовано" out/threads-result.txt 2>/dev/null; then
            cp out/threads-result.txt "queue/posted-$TODAY.txt"
            git config user.name "scheduled-post bot"
            git config user.email "actions@users.noreply.github.com"
            git add "queue/posted-$TODAY.txt"
            git commit -qm "scheduled post: posted $TODAY" && git pull --rebase -q origin main && git push || true
          fi
      - name: Bluesky (если в посте есть поле en)
        continue-on-error: true
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          TODAY=$(date -u +%F)
          [ -f "queue/$TODAY.json" ] || exit 0
          [ -f "queue/bsky-$TODAY.txt" ] && { echo "Bluesky: сегодня уже опубликовано"; exit 0; }
          [ "$(jq -r '.en // empty' "queue/$TODAY.json")" ] || exit 0
          node tools/post-social.mjs --post "queue/$TODAY.json" --bsky
          if grep -q "^Bluesky: опубликовано" out/social-result.txt 2>/dev/null; then
            cp out/social-result.txt "queue/bsky-$TODAY.txt"
            git config user.name "scheduled-post bot"
            git config user.email "actions@users.noreply.github.com"
            git add "queue/bsky-$TODAY.txt"
            git commit -qm "scheduled post: bluesky $TODAY" && git pull --rebase -q origin main && git push || true
          fi
      - name: Save refreshed Threads token
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          [ -f out/new-token.txt ] || exit 0
          echo "::add-mask::$(cat out/new-token.txt)"
          [ -n "$GH_TOKEN" ] || exit 0
          gh secret set THREADS_TOKEN --repo ${{ github.repository }} < out/new-token.txt
      - name: Telegram для Антона
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          grep -q "^опубликовано" out/threads-result.txt 2>/dev/null && node tools/notify.mjs "✅ Пост из очереди опубликован в Threads" || true
