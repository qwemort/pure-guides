name: catch-up
# Страховка расписания (Антон 23.11.2026): GitHub иногда задерживает и пропускает запуски по cron.
# Каждые 2 часа запускает вручную то, что пропало. Посты — только при data/catch-up.json → allow_posts: true.
# Логика — tools/catch-up.mjs.
on:
  schedule:
    - cron: '7 */2 * * *'
    - cron: '52 */2 * * *'   # второй шанс в тот же двухчасовой отрезок, если первый GitHub тоже пропустит
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency: { group: catch-up, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Catch up
        run: |
          node tools/catch-up.mjs | tee -a "$GITHUB_STEP_SUMMARY"
          # о пропущенных постах — не чаще раза в день (в 10–12 UTC), чтобы не спамить
          H=$(date -u +%H); M=$(date -u +%M); if [ -s out/catch-up.txt ] && [ "$H" = "10" ] && [ "$M" -lt 30 ]; then node tools/notify.mjs "$(cat out/catch-up.txt)" || true; fi
