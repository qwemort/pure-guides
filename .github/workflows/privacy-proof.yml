name: privacy-proof
# Публичное доказательство «расширение ничего не отправляет» (Антон 22.11.2026). Раз в неделю и вручную.
# Результат — privacy-proof/README.md (виден всем на GitHub). Тревога Антону — только если что-то не так.
on:
  schedule:
    - cron: '43 10 * * 0'   # воскресенье, 11:43 Варшава
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: privacy-proof, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with: { repository: qwemort/pure-spoiler-shield, path: ext/shield }
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Setup
        run: |
          npm i --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 ext/shield/tools/build.py >/dev/null
          echo "SHIELD_SHA=$(git -C ext/shield rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Check
        run: |
          node tools/privacy-proof.mjs --ext ext/shield/release/chrome | tee -a "$GITHUB_STEP_SUMMARY"
          [ -s out/privacy-proof.txt ] && node tools/notify.mjs "$(cat out/privacy-proof.txt)" || true
      - name: Publish report
        run: |
          git config user.name "privacy-proof bot"; git config user.email "actions@users.noreply.github.com"
          git add privacy-proof/README.md data/privacy-proof.json
          git diff --cached --quiet || { git commit -qm "privacy-proof: $(date -u +%F)"; git pull --rebase --autostash -q origin main; git push origin HEAD:main; }
