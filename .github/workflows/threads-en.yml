name: threads-en
# Переводит новые посты укр. Threads на английский аккаунт (GitHub Models, бесплатно). Публикует только если переменная репозитория
# THREADS_EN_PUBLISH = true (или запуск вручную с publish=true). Иначе черновик в сводке запуска.
on:
  schedule:
    - cron: '35 */3 * * *'
  workflow_dispatch:
    inputs:
      publish: { description: 'Опубликовать (true) или черновик (false)', default: 'false' }
      last: { description: 'Черновик по последним N постам (0 = обычный режим)', default: '0' }
permissions:
  contents: write
  models: read
concurrency: { group: threads-en, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - name: Translate
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_TOKEN_EN: ${{ secrets.THREADS_TOKEN_EN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PUBLISH: ${{ github.event.inputs.publish || vars.THREADS_EN_PUBLISH }}
          LAST: ${{ github.event.inputs.last || '0' }}
        run: |
          ARGS=""
          [ "$PUBLISH" = "true" ] && ARGS="--publish"
          [ "$LAST" != "0" ] && ARGS="$ARGS --last $LAST"
          node tools/translate-threads.mjs $ARGS
          cat out/threads-en-draft.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Save state
        run: |
          git config user.name "threads-en bot"
          git config user.email "actions@users.noreply.github.com"
          [ -f data/threads-en-done.json ] && git add data/threads-en-done.json
          git diff --cached --quiet || { git commit -qm "threads-en: state" && git pull --rebase -q origin main && git push || true; }
      - name: Save refreshed EN token
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          [ -f out/new-token-en.txt ] || exit 0
          echo "::add-mask::$(cat out/new-token-en.txt)"
          [ -n "$GH_TOKEN" ] || exit 0
          gh secret set THREADS_TOKEN_EN --repo ${{ github.repository }} < out/new-token-en.txt
