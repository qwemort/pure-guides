name: store-rank
# Раз в день смотрит, на каком месте Spoiler Blocker в поиске Chrome Web Store по 4 запросам. Только публичные страницы.
on:
  schedule:
    - cron: '47 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: store-rank, cancel-in-progress: false }
jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: |
          npm i --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Measure
        run: node tools/store-rank.mjs && { cat out/store-rank.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true; }
      - name: Commit
        run: |
          git config user.name "store-rank bot"; git config user.email "actions@users.noreply.github.com"
          git add data/store-rank.json
          git diff --cached --quiet || { git commit -qm "store rank: $(date -u +%F)"; git pull --rebase -q origin "$GITHUB_REF_NAME"; git push origin "HEAD:$GITHUB_REF_NAME"; }
